name: shellcheck

on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'install.sh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    paths:
      - 'bin/**'
      - 'install.sh'
      - '.github/workflows/shellcheck.yml'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          set -e
          shopt -s nullglob
          files=(install.sh bin/*)
          # Only check files that look like shell scripts (have a sh/bash shebang)
          targets=()
          for f in "${files[@]}"; do
            [[ -f "$f" ]] || continue
            if head -n1 "$f" | grep -qE '^#!.*\b(bash|sh)\b'; then
              targets+=("$f")
            fi
          done
          if [[ ${#targets[@]} -eq 0 ]]; then
            echo "No shell scripts found."
            exit 0
          fi
          printf 'Checking: %s\n' "${targets[@]}"
          shellcheck -x -S style "${targets[@]}"
