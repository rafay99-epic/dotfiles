# =============================================================================
# Starship Prompt — Tokyo Night  (bracket style)
# Author : Prometheus
# Version: 5.0
# Docs   : https://starship.rs
# =============================================================================
#
#  Layout:
#
#    ╭─  ~/dots/sketchybar  main ● ✚ ⇡          node  dart
#    ╰─❯
#
#  ╭─  top row: directory → git branch → git status │ tech stack (right)
#  ╰─❯ bottom row: prompt (green = ok · red = error)
#
#  Git icons  (no numbers — read state, not counts):
#    ✓  clean        ●  modified      ✚  staged
#    ⇡  ahead        ⇣  behind        ⇕  diverged
#    …  untracked    ✖  deleted       ⊙  stashed
#       conflicts   »  renamed
#
# =============================================================================

palette     = 'tokyo_night'
add_newline = true

format = """
[╭─](fg:muted)\
$directory\
$git_branch\
$git_status\
$git_state\
$fill\
$nodejs\
$bun\
$python\
$rust\
$golang\
$java\
$dart\
$kotlin\
$haskell\
$docker_context\
$conda\
$line_break\
[╰─](fg:muted)\
$character"""

# ── Tokyo Night palette ───────────────────────────────────────────────────────
[palettes.tokyo_night]
bg      = '#1a1b26'
surface = '#24283b'
overlay = '#414868'
muted   = '#565f89'
fg      = '#a9b1d6'
blue    = '#7aa2f7'
purple  = '#bb9af7'
cyan    = '#7dcfff'
green   = '#9ece6a'
yellow  = '#e0af68'
red     = '#f7768e'
orange  = '#ff9e64'

# =============================================================================
# Core
# =============================================================================

[character]
success_symbol = '[❯](bold fg:green)'
error_symbol   = '[❯](bold fg:red)'
vimcmd_symbol  = '[❮](bold fg:purple)'

[fill]
symbol = ' '

# =============================================================================
# Directory
# =============================================================================

[directory]
format            = '[ $path]($style)[$read_only]($read_only_style)  '
style             = 'fg:blue bold'
read_only         = ' '
read_only_style   = 'fg:red'
truncation_length = 4
truncate_to_repo  = true
home_symbol       = '~'

[directory.substitutions]
'Documents' = 'docs'
'Downloads' = 'dl'
'Desktop'   = 'desk'
'dotfiles'  = 'dots'
'Projects'  = 'proj'

# =============================================================================
# Git
# =============================================================================

[git_branch]
format = '[$symbol$branch]($style) '
symbol = ' '
style  = 'fg:purple'

[git_status]
# Pure icons — presence only, no counts
format      = '([$all_status$ahead_behind]($style) )'
style       = ''
up_to_date  = '[✓](fg:green)'
conflicted  = '[](fg:red)'
ahead       = '[⇡](fg:green)'
behind      = '[⇣](fg:yellow)'
diverged    = '[⇕](fg:red)'
untracked   = '[…](fg:muted)'
stashed     = '[⊙](fg:cyan)'
modified    = '[●](fg:yellow)'
staged      = '[✚](fg:green)'
renamed     = '[»](fg:cyan)'
deleted     = '[✖](fg:red)'

[git_state]
format      = '\[[$state( $progress_current/$progress_total)](fg:yellow)\] '
rebase      = 'REBASE'
merge       = 'MERGE'
revert      = 'REVERT'
cherry_pick = 'CHERRY'
bisect      = 'BISECT'
am          = 'AM'
am_or_rebase = 'AM/REBASE'

# =============================================================================
# Tech stack  (right side — only shown when detected in current project)
# =============================================================================

[nodejs]
format         = '[ $symbol$version](fg:green) '
symbol         = ' '
version_format = 'v${major}'
detect_files   = ['package.json', '.node-version', '.nvmrc']
detect_folders = ['node_modules']

[bun]
format         = '[ $symbol$version](fg:yellow) '
symbol         = '󰿅 '
version_format = 'v${major}.${minor}'

[python]
format         = '[ $symbol$version( \($virtualenv\))](fg:yellow) '
symbol         = ' '
version_format = 'v${major}.${minor}'
detect_files   = ['requirements.txt', 'pyproject.toml', 'setup.py', '.python-version', 'Pipfile']

[rust]
format         = '[ $symbol$version](fg:orange) '
symbol         = '󱘗 '
version_format = 'v${major}.${minor}'

[golang]
format         = '[ $symbol$version](fg:cyan) '
symbol         = ' '
version_format = 'v${major}.${minor}'

[java]
format         = '[ $symbol$version](fg:red) '
symbol         = ' '
version_format = 'v${major}'

[dart]
format         = '[ $symbol$version](fg:blue) '
symbol         = ' '
version_format = 'v${major}.${minor}'

[kotlin]
format         = '[ $symbol$version](fg:purple) '
symbol         = ' '
version_format = 'v${major}.${minor}'

[haskell]
format         = '[ $symbol$version](fg:purple) '
symbol         = ' '
version_format = 'v${major}.${minor}'

[docker_context]
format          = '[ $symbol$context](fg:cyan) '
symbol          = ' '
only_with_files = true

[conda]
format      = '[ $symbol$environment](fg:green) '
symbol      = ' '
ignore_base = true

# =============================================================================
# Disabled
# =============================================================================

[username]
disabled = true

[hostname]
disabled = true

[time]
disabled = true

[battery]
disabled = true

[memory_usage]
disabled = true

[cmd_duration]
disabled = true
