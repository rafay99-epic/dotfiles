# git-cliff config — generates release notes from Conventional Commits.
# Run locally: `git-cliff --tag vX.Y.Z` (or `git-cliff --unreleased`).
# CI invokes this on tag push via .github/workflows/release.yml.

[changelog]
header = ""
trim = true
footer = ""

body = """
{% if version %}\
## What's changed in {{ version }}
{% else %}\
## Unreleased
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\\n") | first | trim }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
{% if previous and previous.version %}
**Full diff**: https://github.com/$REPO/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
topo_order = false
sort_commits = "newest"

commit_parsers = [
  { message = "^feat",     group = "Features" },
  { message = "^fix",      group = "Fixes" },
  { message = "^docs",     group = "Docs" },
  { message = "^refactor", group = "Refactor" },
  { message = "^perf",     group = "Performance" },
  { message = "^ci",       group = "CI" },
  { message = "^chore",    group = "Maintenance" },
  { message = "^test",     group = "Tests" },
  { message = "^style",    group = "Style" },
  { message = ".*",        group = "Other" },
]
