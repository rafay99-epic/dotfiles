after-login-command = []

after-startup-command = ['exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0']

start-at-login = true

enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

key-mapping.preset = 'qwerty'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# =============================================================================
# Gaps
# =============================================================================

[gaps]
inner.horizontal = 10
inner.vertical   = 10
outer.left       = 10
outer.bottom     = 10
outer.top        = 8    # laptop: notch safe area handled by macOS
outer.right      = 10

# =============================================================================
# Keybindings — main mode
# =============================================================================

[mode.main.binding]

# ── Layout ────────────────────────────────────────────────────────────────────
alt-t = 'layout tiles horizontal vertical'
alt-f = 'layout floating tiling'

# ── Split (BSP-style tiling) ─────────────────────────────────────────────────
# Press before opening a new window to control where it appears.
#   Alt+V  → next window splits vertically (top/bottom)
#   Alt+B  → next window splits horizontally (side by side)
#   Alt+O  → next window splits in the opposite direction (auto-alternates)
alt-v = 'split vertical'
alt-b = 'split horizontal'
alt-o = 'split opposite'

# ── Balance windows ──────────────────────────────────────────────────────────
alt-shift-b = 'balance-sizes'

# ── Window focus (vim keys) ───────────────────────────────────────────────────
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# ── Window move ───────────────────────────────────────────────────────────────
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# ── Resize ────────────────────────────────────────────────────────────────────
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# ── Workspaces 1–5 ────────────────────────────────────────────────────────────
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'

# ── Workspaces 6–9 ────────────────────────────────────────────────────────────
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# ── Move window to workspace ──────────────────────────────────────────────────
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# ── Monitor focus ─────────────────────────────────────────────────────────────
alt-shift-leftSquareBracket  = 'focus-monitor --wrap-around left'
alt-shift-rightSquareBracket = 'focus-monitor --wrap-around right'

# ── Workspace navigation ──────────────────────────────────────────────────────
alt-tab       = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# ── Profile sync ──────────────────────────────────────────────────────────────
alt-d = 'exec-and-forget /Users/prometheus/.local/bin/aerospace-sync'

# ── Modes ─────────────────────────────────────────────────────────────────────
alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc       = ['reload-config', 'mode main']
r         = ['flatten-workspace-tree', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# ── Window detection ──────────────────────────────────────────────────────────
# Everything tiles by default — no floating overrides.
# To manually toggle any window between float/tile: Alt+F
