after-login-command = []

after-startup-command = []

start-at-login = true


enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30

default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

key-mapping.preset = 'qwerty'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = 8
outer.right = 10

[mode.main.binding]
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'


alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-tab = 'workspace-back-and-forth'

alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = [
    'layout floating tiling',
    'mode main',
] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# ── Window detection ───────────────────────────────────────────────────────
#
# THE PROBLEM: macOS native tabs (Ghostty Cmd+T, Finder Cmd+T) are separate
# OS-level windows. AeroSpace can't tell a "tab" apart from a real new window,
# so it tiles them side-by-side — splitting your layout unexpectedly.
#
# THE FIX:
#   • Ghostty windows restored at startup → tile normally (during-aerospace-startup = true)
#   • Ghostty windows opened later (tabs) → float so they don't retile your layout
#   • Finder windows → always float (Finder is not a tiling-friendly app)
#
# WORKFLOW TIP — for splits inside one Ghostty tile, use Ghostty's own splits:
#   Cmd+D         split right       (stays inside one AeroSpace tile)
#   Cmd+Shift+D   split down
#   Cmd+Alt+H/J/K/L  navigate splits
#
# To manually un-float any window: Alt+Shift+; → F

# Ghostty at startup: tile it normally
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
if.during-aerospace-startup = true
run = 'layout tiling'

# Ghostty after startup (new tabs / new windows): float so layout is not disturbed
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
if.during-aerospace-startup = false
run = 'layout floating'

# Finder: always float — it opens random windows (Copy dialogs, new folders, etc.)
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'
